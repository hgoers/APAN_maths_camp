project:
  type: website
  output-dir: docs

website:
  title: "APAN Maths Camp"
  google-analytics: ""
  repo-url: https://hgoers.github.io/APAN_maths_camp/
  repo-actions: [issue]

  favicon: "/files/img/hex-testudo.png"

  navbar:
    pinned: true
    background: "#C31832"
    right:
      - href: index.qmd
        text: Home
      - href: content/00-introduction.qmd
        text: Content

  sidebar:
    - title: "Content"
      style: "docked"
      contents:
        - section: "Introduction to Political Science Data Analysis"
          contents: 
            - content/00-introduction.qmd
            - content/01-measurement.qmd
            - content/02-experiments.qmd
            - content/03-surveys_to_pops.qmd
            - content/04-bivariate.qmd
            - content/05-probability.qmd
            - content/06-hypothesis.qmd
            - content/07-linear_regression.qmd
            - content/08-uncertainty.qmd
            - content/09-binary_outcomes.qmd
            - content/10-panel_data.qmd
        - section: "Introduction to R"
          contents:
            - content/intro_to_r-00-introduction.qmd
            - content/intro_to_r-01-visualization.qmd         
            - content/intro_to_r-02-transformation.qmd
            - content/intro_to_r-03-wrangling.qmd
            - content/intro_to_r-04-merging.qmd
            - content/intro_to_r-05-programming.qmd
            - content/intro_to_r-06-communicating.qmd
            
            
  page-footer:
    left: |
      Content {{< fa brands creative-commons >}} {{< var course.copyright_year >}} by [{{< var instructor.name_no_title >}}]({{< var instructor.url >}}) <br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution-Non Commercial 4.0 International license (CC BY-NC 4.0)](https://creativecommons.org/licenses/by-nc/4.0/)
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [Heavily inspired by course websites built by Dr Andrew Heiss](https://www.andrewheiss.com/teaching/)

format:
  html:
    theme: litera
    css: html/custom.css
    toc: true
    highlight-style: monokai

editor: visual

